# Copy to k8s/secret.yaml, fill in, and DO NOT commit it (gitignored).
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # edit, then:
#   kubectl apply -f k8s/secret.yaml -n uhc-dev
#
# Or create it without a file at all, which keeps the values out of your shell
# history if you use a leading space:
#
#   kubectl create secret generic provider-cluster-cleanup-secrets -n uhc-dev \
#     --from-literal=ADMIN_USERNAME=ccsadmin \
#     --from-literal=ADMIN_PASSWORD='...' \
#     --from-literal=MONGO_USER=sigma \
#     --from-literal=MONGO_PASSWORD='...'
apiVersion: v1
kind: Secret
metadata:
  name: provider-cluster-cleanup-secrets
  labels:
    app: provider-cluster-cleanup
type: Opaque
stringData:
  # Used to mint admin tokens on demand (password grant), so nobody pastes
  # short-lived tokens into the UI.
  ADMIN_USERNAME: ""
  ADMIN_PASSWORD: ""

  # Config DB credentials.
  MONGO_USER: ""
  MONGO_PASSWORD: ""
  MONGO_DB: "ccp-ext-config"

  # Optional host overrides; the ConfigMap has working defaults.
  # ADMIN_BASE_URL: ""
  # CONSOLE_BASE_URL: ""
  # AUTH_BASE_URL: ""
