{{- /* Skipped entirely when pointing at a Secret you manage yourself. */ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pcc.fullname" . }}-secrets
  labels:
    {{- include "pcc.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_USERNAME: {{ required "secrets.adminUsername is required (or set secrets.existingSecret)" .Values.secrets.adminUsername | quote }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required (or set secrets.existingSecret)" .Values.secrets.adminPassword | quote }}
  MONGO_USER: {{ required "secrets.mongoUser is required (or set secrets.existingSecret)" .Values.secrets.mongoUser | quote }}
  MONGO_PASSWORD: {{ required "secrets.mongoPassword is required (or set secrets.existingSecret)" .Values.secrets.mongoPassword | quote }}
{{- end }}
